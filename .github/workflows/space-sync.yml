name: Sync Hugging Face Space

on:
  push:
    branches:
      - main
      - vken/v1

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ secrets.HF_SPACE_REPO != '' && secrets.HF_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to Space
        env:
          HF_SPACE_REPO: ${{ secrets.HF_SPACE_REPO }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add hf-space "https://oauth2:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_REPO}"
          git push hf-space HEAD:main --force
