name: Sync Hugging Face Space

on:
  push:
    branches:
      - main
      - vken/v1

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Upload to Space
        env:
          HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -q "huggingface_hub>=0.29.0"
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(
              folder_path=".",
              repo_id=os.environ["HF_SPACE_REPO"],
              repo_type="space",
              ignore_patterns=[
                  ".git/**", ".github/**", ".worktrees/**",
                  "assets/prompt-templates/video/**",
                  "assets/community-pets/**",
                  "node_modules/**", ".od/**", ".tmp/**",
                  "e2e/**", "*.log",
              ],
              commit_message="ci: sync from vken/v1",
          )
          print("Space upload complete")
          EOF
